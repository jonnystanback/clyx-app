<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>clyx</title>
  <meta name="description" content="A social layer for real experiences. See what your friends and favorite communities are doing.">
  <link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="assets/favicon.png?v=2" type="image/png" sizes="512x512">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">

  <!-- Social share card -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="clyx">
  <meta property="og:title" content="clyx">
  <meta property="og:description" content="A social layer for real experiences. See what your friends and favorite communities are doing.">
  <meta property="og:url" content="https://clyx-app-mu.vercel.app/">
  <meta property="og:image" content="https://clyx-app-mu.vercel.app/assets/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The clyx logo on yellow">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="clyx">
  <meta name="twitter:description" content="A social layer for real experiences. See what your friends and favorite communities are doing.">
  <meta name="twitter:image" content="https://clyx-app-mu.vercel.app/assets/share.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=28">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner glass">
      <a href="#/" class="logo" aria-label="clyx home"><img src="assets/logo.svg" alt="clyx"></a>
      <nav class="topnav" aria-label="Main">
        <a href="#/explore" data-nav="explore">Explore</a>
        <a href="#/my-events" data-nav="my-events">My Events</a>
        <a href="#/friends" data-nav="friends">Friends</a>
      </nav>
      <nav class="sitenav" aria-label="Site">
        <a href="#/explore">App</a>
        <button data-scroll="about">About</button>
        <button data-scroll="reviews">Reviews</button>
        <button class="sitenav__cta" data-toast="Event creation is coming soon">Create an Event</button>
      </nav>
      <a href="#/profile" class="topbar__me" aria-label="Your profile"><img id="me-avatar" alt=""></a>
      <button class="menu-btn" data-menu aria-label="Menu" aria-expanded="false" aria-controls="mnav"><span></span><span></span></button>
    </div>
    <nav class="mnav glass" id="mnav" aria-label="Menu">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/explore" data-nav="explore">Explore</a>
      <a href="#/my-events" data-nav="my-events">My Events</a>
      <a href="#/friends" data-nav="friends">Friends</a>
      <a href="#/profile" data-nav="profile">Profile</a>
      <div class="mnav__row">
        <button data-scroll="about">About</button>
        <button data-scroll="reviews">Reviews</button>
      </div>
      <button class="mnav__cta" data-toast="Event creation is coming soon">Create an Event</button>
    </nav>
  </header>

  <!-- Liquid-glass refraction for the header pill and mobile menu. app.js draws the displacement map to fit the pill. -->
  <svg class="glass-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="liquid-glass" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB" primitiveUnits="userSpaceOnUse">
      <feImage id="liquid-glass-map" x="0" y="0" width="1" height="1" preserveAspectRatio="none" result="map"/>
      <feDisplacementMap in="SourceGraphic" in2="map" scale="96" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="liquid-glass-menu" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB" primitiveUnits="userSpaceOnUse">
      <feImage id="liquid-glass-menu-map" x="0" y="0" width="1" height="1" preserveAspectRatio="none" result="map"/>
      <feDisplacementMap in="SourceGraphic" in2="map" scale="80" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <main id="view" tabindex="-1"></main>


  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="data.js?v=2"></script>
  <script src="home.js?v=6"></script>
  <script src="profile.js?v=6"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
